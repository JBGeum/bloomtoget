spring:
  # H2 in-memory database for testing (not used yet, but ready for future)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable security for testing
  security:
    enabled: false

# JWT Configuration for testing
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hs256-algorithm
  access-token-validity-in-seconds: 3600  # 1 hour
  refresh-token-validity-in-seconds: 604800  # 7 days

logging:
  level:
    org.springframework.web: DEBUG
    com.btg: DEBUG
