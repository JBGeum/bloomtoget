openapi: 3.0.0
info:
  title: Bloomtoget API
  description: |
    그룹 기반 TODO 협업 서비스

    **v1.0 범위**: Auth, Users, Groups(공개만), Tasks, DailyProgress
    **v2.0 계획**: 비공개 그룹, 초대, Friends, 알림

    **개발 순서**: 1.Auth → 2.Users → 3.Groups → 4.Tasks → 5.DailyProgress
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.bloomtoget.com
    description: Production

tags:
  - name: Auth
    description: 회원가입, 로그인, 토큰 관리 (1단계)
  - name: Users
    description: 사용자 정보 CRUD (2단계)
  - name: Groups
    description: 그룹 CRUD, 검색 (3단계, 공개 그룹만)
  - name: Group Members
    description: 그룹 가입, 탈퇴 (3단계)
  - name: Tasks
    description: Task CRUD, 상태 관리 (4단계)
  - name: Task Members
    description: Task 참가, 참가자 목록 (4단계)
  - name: Daily Progress
    description: 일일 달성 체크 (5단계)

paths:
  # ==================== Auth ====================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: 이메일 중복 시 409 에러
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: JWT 토큰 발급
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: AccessToken 갱신
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: RefreshToken 무효화
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 성공

  # ==================== Users ====================
  /users/me:
    get:
      tags: [Users]
      summary: 내 정보 조회
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Users]
      summary: 내 정보 수정
      description: 이름, 비밀번호 변경
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== Groups ====================
  /groups:
    get:
      tags: [Groups]
      summary: 그룹 목록 조회
      description: MY(내 그룹), ALL(전체 공개 그룹)
      operationId: listGroups
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [MY, ALL]
            default: MY
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGroupResponse'

    post:
      tags: [Groups]
      summary: 그룹 생성
      description: 생성자는 자동으로 ADMIN
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /groups/search:
    get:
      tags: [Groups]
      summary: 그룹 검색
      description: 이름으로 공개 그룹 검색
      operationId: searchGroups
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 검색어
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedGroupResponse'

  /groups/{groupId}:
    get:
      tags: [Groups]
      summary: 그룹 상세 조회
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Groups]
      summary: 그룹 수정
      description: 권한=ADMIN
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Groups]
      summary: 그룹 삭제
      description: 권한=ADMIN
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '204':
          description: 성공
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== Group Members ====================
  /groups/{groupId}/members:
    get:
      tags: [Group Members]
      summary: 그룹 멤버 목록
      operationId: listGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberListResponse'

    post:
      tags: [Group Members]
      summary: 그룹 가입
      description: 즉시 가입 (공개 그룹)
      operationId: joinGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberResponse'
        '400':
          description: 이미 가입됨
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{groupId}/members/me:
    delete:
      tags: [Group Members]
      summary: 그룹 탈퇴
      description: ADMIN은 탈퇴 불가
      operationId: leaveGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      responses:
        '204':
          description: 성공
        '400':
          description: ADMIN은 탈퇴 불가
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== Tasks ====================
  /tasks:
    get:
      tags: [Tasks]
      summary: Task 목록 조회
      description: groupId로 필터링 가능
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 그룹 ID (생략 시 전체)
        - name: status
          in: query
          schema:
            type: string
            enum: [ALL, RECRUITING, IN_PROGRESS, COMPLETED, CANCELLED]
            default: ALL
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTaskResponse'

    post:
      tags: [Tasks]
      summary: Task 생성
      description: 생성자는 자동 참가, 초기 상태=RECRUITING
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Task 상세 조회
      operationId: getTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tasks]
      summary: Task 수정
      description: 권한=생성자 or 그룹 ADMIN
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Tasks]
      summary: Task 삭제
      description: RECRUITING 상태만 가능, 권한=생성자 or 그룹 ADMIN
      operationId: deleteTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '204':
          description: 성공
        '400':
          description: RECRUITING 상태 아님
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{taskId}/status:
    patch:
      tags: [Tasks]
      summary: Task 상태 변경
      description: |
        권한=생성자 or 그룹 ADMIN

        **상태 전이**:
        RECRUITING → IN_PROGRESS, CANCELLED
        IN_PROGRESS → COMPLETED, CANCELLED
        COMPLETED/CANCELLED → 변경 불가
      operationId: updateTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: 잘못된 상태 전이
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidStateTransitionError'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== Task Members ====================
  /tasks/{taskId}/members:
    get:
      tags: [Task Members]
      summary: Task 참가자 목록
      operationId: listTaskMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMemberListResponse'

    post:
      tags: [Task Members]
      summary: Task 참가
      description: 그룹 멤버만 참가 가능, DailyProgress 자동 생성
      operationId: joinTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMemberResponse'
        '400':
          description: 이미 참가 or 참가 불가 상태
        '403':
          description: 그룹 멤버 아님

  /tasks/{taskId}/members/me:
    delete:
      tags: [Task Members]
      summary: Task 참가 취소
      description: IN_PROGRESS 상태에서는 취소 불가
      operationId: leaveTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '204':
          description: 성공
        '400':
          description: IN_PROGRESS 상태에서는 취소 불가

  /tasks/{taskId}/progress:
    get:
      tags: [Task Members]
      summary: Task 전체 진행률
      operationId: getTaskProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgressResponse'

  # ==================== Daily Progress ====================
  /tasks/{taskId}/daily-progress:
    get:
      tags: [Daily Progress]
      summary: 전체 참가자 날짜별 달성 통계
      operationId: listDailyProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyProgressSummaryResponse'

  /tasks/{taskId}/daily-progress/me:
    get:
      tags: [Daily Progress]
      summary: 내 날짜별 달성 현황
      operationId: getMyDailyProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDailyProgressResponse'

  /tasks/{taskId}/daily-progress/{date}:
    patch:
      tags: [Daily Progress]
      summary: 특정 날짜 달성 상태 변경
      description: completed=true 시 completedAt 자동 기록
      operationId: updateDailyProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdParam'
        - name: date
          in: path
          required: true
          description: YYYY-MM-DD
          schema:
            type: string
            format: date
          example: '2025-11-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDailyProgressRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyProgressResponse'
        '400':
          description: Task 상태가 RECRUITING이거나 날짜 범위 밖

# ==================== Components ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupIdParam:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    TaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    # ==================== Auth ====================
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 100
        name:
          type: string
          minLength: 2
          maxLength: 50

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    # ==================== User ====================
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 100
          nullable: true
          description: 변경 시에만 포함

    # ==================== Group ====================
    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        maxMembers:
          type: integer
          minimum: 2
          maximum: 100
          nullable: true

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        maxMembers:
          type: integer
          minimum: 2
          maximum: 100
          nullable: true

    GroupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        memberCount:
          type: integer
        maxMembers:
          type: integer
          nullable: true
        createdBy:
          $ref: '#/components/schemas/UserResponse'
        createdAt:
          type: string
          format: date-time

    GroupDetailResponse:
      allOf:
        - $ref: '#/components/schemas/GroupResponse'
        - type: object
          properties:
            myRole:
              type: string
              enum: [ADMIN, MEMBER, NONE]
            taskCount:
              type: integer

    PagedGroupResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/GroupResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ==================== Group Member ====================
    GroupMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserResponse'
        role:
          type: string
          enum: [ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time

    GroupMemberListResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMemberResponse'
        totalCount:
          type: integer

    # ==================== Task ====================
    CreateTaskRequest:
      type: object
      required: [groupId, title, startDate, endDate]
      properties:
        groupId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 1000
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        maxParticipants:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        description:
          type: string
          maxLength: 1000
          nullable: true
        maxParticipants:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true

    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, CANCELLED]

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        groupId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [RECRUITING, IN_PROGRESS, COMPLETED, CANCELLED]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        totalDays:
          type: integer
          readOnly: true
        participantCount:
          type: integer
        maxParticipants:
          type: integer
          nullable: true
        overallCompletionRate:
          type: number
          format: float
          readOnly: true
        createdBy:
          $ref: '#/components/schemas/UserResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TaskResponse'
        - type: object
          properties:
            isParticipating:
              type: boolean
            myCompletionRate:
              type: number
              format: float
              nullable: true

    PagedTaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    # ==================== Task Member ====================
    TaskMemberResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserResponse'
        completionRate:
          type: number
          format: float
        completedDays:
          type: integer
        totalDays:
          type: integer
        joinedAt:
          type: string
          format: date-time

    TaskMemberListResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/TaskMemberResponse'
        totalCount:
          type: integer
        averageCompletionRate:
          type: number
          format: float

    TaskProgressResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        totalParticipants:
          type: integer
        totalDays:
          type: integer
        overallCompletionRate:
          type: number
          format: float
        averageCompletionRate:
          type: number
          format: float

    # ==================== Daily Progress ====================
    UpdateDailyProgressRequest:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean

    DailyProgressResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true

    MyDailyProgressResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        dailyRecords:
          type: array
          items:
            $ref: '#/components/schemas/DailyProgressResponse'

    DailyProgressSummaryResponse:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dailyStats:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              completedCount:
                type: integer
              totalParticipants:
                type: integer
              completionRate:
                type: number
                format: float

    # ==================== Error ====================
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    InvalidStateTransitionError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "INVALID_STATE_TRANSITION"
            message:
              type: string
            currentStatus:
              type: string
            requestedStatus:
              type: string

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: 리소스 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
